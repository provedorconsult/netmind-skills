name: Validate Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate docs, indexes and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py docs
      - name: Check generated indexes
        run: python scripts/build_indexes.py --check
      - name: Lint Markdown
        run: python scripts/lint_markdown.py .
      - name: Validate internal Markdown links
        run: python scripts/validate_markdown_links.py .
