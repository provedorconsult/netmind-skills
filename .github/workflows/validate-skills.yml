name: Validate Skills

on:
  pull_request:
    paths:
      - ".github/workflows/validate-skills.yml"
      - "scripts/**"
      - "skills/**"
      - "*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-skills.yml"
      - "scripts/**"
      - "skills/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate all Skills
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run Skill Creator structural validator
        run: python scripts/validate_repository.py
